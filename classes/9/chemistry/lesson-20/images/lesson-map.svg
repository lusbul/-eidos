<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<rect width="1200" height="860" fill="white"/>
<text x="600" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="bold" fill="#17346a">Електролітична дисоціація</text>
<text x="600" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#425f89">Мапа ключових понять</text>
<rect x="42" y="158" width="540" height="190" rx="25" fill="#e9f4ff" stroke="#bfd1e9" stroke-width="2"/>
<text x="67" y="207" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17346a">ЕЛЕКТРОЛІТИ</text>
<text x="68" y="252" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">У воді утворюють рухливі йони</text>
<text x="68" y="289" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Розчини проводять електричний струм</text>
<rect x="622" y="158" width="540" height="190" rx="25" fill="#f0eaff" stroke="#bfd1e9" stroke-width="2"/>
<text x="647" y="207" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17346a">ДИСОЦІАЦІЯ</text>
<text x="648" y="252" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Розпад на катіони й аніони</text>
<text x="648" y="289" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">NaCl → Na⁺ + Cl⁻</text>
<rect x="42" y="376" width="540" height="190" rx="25" fill="#e8f8f1" stroke="#bfd1e9" stroke-width="2"/>
<text x="67" y="425" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17346a">СИЛЬНІ ТА СЛАБКІ</text>
<text x="68" y="470" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">NaCl, HCl — сильні електроліти</text>
<text x="68" y="507" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">CH₃COOH — слабкий електроліт</text>
<rect x="622" y="376" width="540" height="190" rx="25" fill="#fff3e2" stroke="#bfd1e9" stroke-width="2"/>
<text x="647" y="425" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17346a">НЕЕЛЕКТРОЛІТИ</text>
<text x="648" y="470" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Цукор не утворює йонів</text>
<text x="648" y="507" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Дистильована вода проводить дуже слабо</text>
<rect x="42" y="594" width="540" height="190" rx="25" fill="#fcecf4" stroke="#bfd1e9" stroke-width="2"/>
<text x="67" y="643" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17346a">РУХ ЙОНІВ</text>
<text x="68" y="688" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Катіони (+) рухаються до катода</text>
<text x="68" y="725" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Аніони (−) рухаються до анода</text>
<rect x="622" y="594" width="540" height="190" rx="25" fill="#e9f5f7" stroke="#bfd1e9" stroke-width="2"/>
<text x="647" y="643" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#17346a">ПІДСУМОК</text>
<text x="648" y="688" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">Наявність рухливих йонів</text>
<text x="648" y="725" font-family="Arial,sans-serif" font-size="22" fill="#1c3151">визначає провідність розчину</text>
</svg>